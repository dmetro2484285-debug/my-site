<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>кайфовать.вместе</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;

            color: white;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    ellipse at 50% 45%,
                    #11182b 0%,
                    #080b18 38%,
                    #03040a 72%,
                    #000000 100%
                );
        }


        /* ================================= */
        /*          ГЛУБОКИЙ КОСМОС            */
        /* ================================= */

        body::before {
            content: "";
            position: fixed;
            inset: -20%;

            pointer-events: none;
            z-index: 0;

            background-image:

                radial-gradient(
                    circle,
                    rgba(255,255,255,0.75) 0.35px,
                    transparent 0.9px
                ),

                radial-gradient(
                    circle,
                    rgba(210,225,255,0.7) 0.45px,
                    transparent 1px
                ),

                radial-gradient(
                    circle,
                    rgba(255,255,255,0.55) 0.6px,
                    transparent 1.2px
                ),

                radial-gradient(
                    circle,
                    rgba(255,255,255,0.9) 0.8px,
                    transparent 1.8px
                ),

                radial-gradient(
                    circle,
                    rgba(190,215,255,0.8) 0.9px,
                    transparent 2px
                ),

                radial-gradient(
                    ellipse at 25% 35%,
                    rgba(55,95,190,0.18) 0%,
                    rgba(35,65,145,0.10) 18%,
                    transparent 45%
                ),

                radial-gradient(
                    ellipse at 75% 25%,
                    rgba(120,55,180,0.16) 0%,
                    rgba(90,35,150,0.08) 20%,
                    transparent 48%
                ),

                radial-gradient(
                    ellipse at 65% 75%,
                    rgba(160,45,65,0.11) 0%,
                    rgba(100,25,45,0.06) 20%,
                    transparent 45%
                ),

                radial-gradient(
                    ellipse at 10% 80%,
                    rgba(40,100,170,0.13) 0%,
                    rgba(30,70,130,0.06) 22%,
                    transparent 48%
                );

            background-size:
                38px 42px,
                67px 73px,
                113px 127px,
                190px 210px,
                310px 340px,
                100% 100%,
                100% 100%,
                100% 100%,
                100% 100%;

            background-position:
                0 0,
                27px 51px,
                83px 17px,
                140px 90px,
                210px 40px,
                0 0,
                0 0,
                0 0,
                0 0;

            opacity: 0.9;

            animation: spaceDrift 120s linear infinite;
        }


        /* ================================= */
        /*           ЯРКИЕ ЗВЁЗДЫ              */
        /* ================================= */

        body::after {
            content: "";
            position: fixed;
            inset: -10%;

            pointer-events: none;
            z-index: 0;

            background-image:

                radial-gradient(
                    circle,
                    rgba(255,255,255,1) 0px,
                    rgba(255,255,255,0.95) 1px,
                    rgba(255,255,255,0.35) 2px,
                    transparent 5px
                ),

                radial-gradient(
                    circle,
                    rgba(205,225,255,1) 0px,
                    rgba(175,210,255,0.85) 1px,
                    rgba(100,160,255,0.25) 3px,
                    transparent 7px
                ),

                radial-gradient(
                    circle,
                    rgba(255,245,225,1) 0px,
                    rgba(255,225,190,0.85) 1px,
                    rgba(255,190,150,0.2) 3px,
                    transparent 7px
                ),

                radial-gradient(
                    ellipse at 35% 55%,
                    rgba(50,90,190,0.13) 0%,
                    rgba(40,65,150,0.08) 15%,
                    rgba(30,45,100,0.04) 30%,
                    transparent 58%
                ),

                radial-gradient(
                    ellipse at 82% 65%,
                    rgba(110,45,170,0.12) 0%,
                    rgba(85,35,130,0.07) 18%,
                    rgba(50,25,90,0.03) 35%,
                    transparent 60%
                );

            background-size:
                330px 360px,
                520px 570px,
                700px 760px,
                100% 100%,
                100% 100%;

            background-position:
                35px 20px,
                180px 100px,
                390px 260px,
                0 0,
                0 0;

            opacity: 0.65;

            animation:
                starsTwinkle 9s ease-in-out infinite alternate,
                nebulaDrift 180s linear infinite;
        }


        @keyframes spaceDrift {

            0% {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }

            25% {
                transform:
                    translate3d(-10px, 7px, 0)
                    scale(1.015);
            }

            50% {
                transform:
                    translate3d(-20px, 14px, 0)
                    scale(1.03);
            }

            75% {
                transform:
                    translate3d(-10px, 20px, 0)
                    scale(1.015);
            }

            100% {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }
        }


        @keyframes starsTwinkle {

            0% {
                opacity: 0.42;
            }

            20% {
                opacity: 0.52;
            }

            40% {
                opacity: 0.68;
            }

            60% {
                opacity: 0.48;
            }

            80% {
                opacity: 0.72;
            }

            100% {
                opacity: 0.55;
            }
        }


        @keyframes nebulaDrift {

            0% {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(18px, -12px, 0)
                    scale(1.025);
            }

            100% {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }
        }


        /* ================================= */
        /*              МЕНЮ                  */
        /* ================================= */

        header {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 60px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 35px;

            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px);

            border-bottom: 1px solid rgba(255,255,255,0.08);

            z-index: 1000;
        }


        .logo {
            font-size: 17px;
            font-weight: 600;
            white-space: nowrap;
        }


        nav {
            display: flex;
            gap: 30px;
        }


        nav a {
            color: white;
            text-decoration: none;

            font-size: 14px;

            transition: 0.25s;
        }


        nav a:hover {
            color: #ff2b2b;
        }


        /* ================================= */
        /*              ГЛАВНАЯ                */
        /* ================================= */

        .hero {
            min-height: calc(100vh - 60px);

            margin-top: 60px;

            display: flex;
            align-items: center;

            position: relative;

            z-index: 1;
        }


        /* ================================= */
        /*            ПЕРСОНАЖИ                */
        /* ================================= */

        .characters {
            width: 58%;
            height: calc(100vh - 60px);

            display: flex;
            align-items: flex-end;
            justify-content: center;

            position: relative;
        }


        .characters img {
            width: 1250px;
            max-width: 140%;
            height: auto;

            display: block;

            pointer-events: none;

            transform:
                scaleY(1.5)
                translateY(-1px);

            transform-origin: bottom center;

            filter:
                drop-shadow(
                    0 0 30px rgba(255, 255, 255, 0.07)
                );

            -webkit-mask-image:
                linear-gradient(
                    to bottom,
                    black 88%,
                    rgba(0, 0, 0, 0.95) 94%,
                    rgba(0, 0, 0, 0.8) 98%,
                    transparent 100%
                );

            mask-image:
                linear-gradient(
                    to bottom,
                    black 88%,
                    rgba(0, 0, 0, 0.95) 94%,
                    rgba(0, 0, 0, 0.8) 98%,
                    transparent 100%
                );
        }


        /* ================================= */
        /*                ТЕКСТ                */
        /* ================================= */

        .text {
            width: 42%;

            padding-left: 5px;

            margin-top: -30px;

            position: relative;

            z-index: 20;
        }


        .text h1 {
            margin: 0;

            font-size: clamp(38px, 4vw, 54px);

            font-weight: 700;

            white-space: nowrap;

            max-width: 100%;

            text-shadow:
                0 0 10px rgba(255, 255, 255, 0.25),
                0 0 30px rgba(255, 255, 255, 0.12);
        }


        .text p {
            margin-top: 12px;

            color: rgba(255,255,255,0.65);

            font-size: 15px;
        }


        /* ================================= */
        /*              КНОПКА                 */
        /* ================================= */

        button {
            position: relative;

            z-index: 10000;

            margin-top: 25px;

            padding: 13px 30px;

            background: rgba(15, 15, 15, 0.9);

            color: white;

            border: 1px solid #ff2b2b;

            border-radius: 8px;

            font-size: 16px;

            cursor: pointer;

            transition: 0.25s;

            pointer-events: auto;
        }


        button:hover {
            background: #ff2b2b;

            box-shadow:
                0 0 20px rgba(255,43,43,0.4);
        }


        /* ================================= */
        /*              СЕРДЦА                 */
        /* ================================= */

        #hearts-container {
            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            pointer-events: none;

            overflow: hidden;

            z-index: 9999;
        }


        .heart {
            position: absolute;

            left: 0;
            top: 0;

            color: #ff2b2b;

            line-height: 1;

            pointer-events: none;

            user-select: none;

            will-change:
                transform,
                opacity;

            text-shadow:
                0 0 8px rgba(255, 43, 43, 0.5);

            animation-name: flyHeart;

            animation-timing-function: ease-out;

            animation-fill-mode: forwards;
        }


        @keyframes flyHeart {

            0% {
                transform:
                    translate(
                        var(--start-x),
                        var(--start-y)
                    )
                    scale(0.3)
                    rotate(0deg);

                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            100% {
                transform:
                    translate(
                        var(--end-x),
                        var(--end-y)
                    )
                    scale(var(--scale))
                    rotate(var(--rotation));

                opacity: 0;
            }
        }


        /* ================================= */
        /*              ФОТО                   */
        /* ================================= */

        .photos {
            min-height: 100vh;

            padding: 100px 8%;

            position: relative;

            z-index: 1;
        }


        .photos h2 {
            font-size: 42px;

            margin-bottom: 40px;
        }


        /* ================================= */
        /*              МУЗЫКА                 */
        /* ================================= */

        .music {
            min-height: 100vh;

            padding: 100px 8%;

            position: relative;

            z-index: 1;
        }


        .music h2 {
            font-size: 42px;

            margin-bottom: 15px;
        }


        .music p {
            color: rgba(255,255,255,0.6);
        }


        .music-card {
            width: 360px;

            margin-top: 40px;

            padding: 25px;

            background:
                rgba(10, 10, 18, 0.65);

            border:
                1px solid rgba(255,255,255,0.1);

            border-radius: 12px;

            backdrop-filter: blur(12px);
        }


        .music-title {
            color: rgba(255,255,255,0.5);

            font-size: 13px;

            margin-bottom: 10px;
        }


        .music-name {
            font-size: 20px;

            margin-bottom: 20px;
        }


        .music-controls {
            display: flex;

            align-items: center;

            gap: 12px;
        }


        .music-button {
            margin-top: 0;

            width: 45px;
            height: 45px;

            padding: 0;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;
        }


        .add-music-button {
            margin-top: 0;

            padding: 11px 18px;

            border-radius: 8px;

            font-size: 14px;

            white-space: nowrap;
        }


        .track-list {
            margin-top: 25px;

            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        .track {
            padding: 12px 14px;

            border-radius: 8px;

            background: rgba(255,255,255,0.04);

            border: 1px solid rgba(255,255,255,0.06);

            color: rgba(255,255,255,0.7);

            cursor: pointer;

            transition: 0.2s;
        }


        .track:hover {
            background: rgba(255,255,255,0.08);

            color: white;
        }


        .track.active {
            background: rgba(255,43,43,0.12);

            border-color: rgba(255,43,43,0.4);

            color: white;
        }


        /* ================================= */
        /*            АДАПТИВНОСТЬ             */
        /* ================================= */

        @media (max-width: 1000px) {

            .hero {
                flex-direction: column;

                min-height: auto;

                padding-top: 40px;
            }


            .characters {
                width: 100%;

                height: 65vh;
            }


            .characters img {
                width: 1000px;

                max-width: 120%;
            }


            .text {
                width: 90%;

                padding: 30px 0 80px;

                margin-top: 0;
            }


            .text h1 {
                white-space: normal;
            }


            header {
                padding: 0 18px;
            }


            nav {
                gap: 15px;
            }
        }


        @media (max-width: 600px) {

            header {
                height: 55px;
            }


            .logo {
                font-size: 13px;
            }


            nav {
                gap: 10px;
            }


            nav a {
                font-size: 11px;
            }


            .characters {
                height: 55vh;
            }


            .characters img {
                width: 850px;

                max-width: 150%;
            }


            .text {
                width: 90%;
            }


            .text h1 {
                font-size: 38px;
            }


            .photos,
            .music {
                padding: 80px 7%;
            }


            .music-card {
                width: 100%;
            }


            .music-controls {
                flex-wrap: wrap;
            }
        }

    </style>
</head>


<body>


    <!-- ================================= -->
    <!--                МЕНЮ                -->
    <!-- ================================= -->

    <header>

        <div class="logo">
            suspectstyle for nikto242
        </div>

        <nav>

            <a href="#home">
                Главная
            </a>

            <a href="#photos">
                наши фотачке
            </a>

            <a href="#music">
                музяка
            </a>

        </nav>

    </header>



    <!-- ================================= -->
    <!--              ГЛАВНАЯ               -->
    <!-- ================================= -->

    <main>

        <section class="hero" id="home">

            <div class="characters">

                <img
                    src="characters.png"
                    alt="Персонажи"
                >

            </div>


            <div class="text">

                <h1>
                    кайфовать.вместе
                </h1>

                <p>
                    просто оставайся здесь
                </p>

                <button id="heartButton">
                    Нажми меня
                </button>

            </div>

        </section>



        <!-- ================================= -->
        <!--               ФОТО                  -->
        <!-- ================================= -->

        <section class="photos" id="photos">

            <h2>
                Наши фото
            </h2>

        </section>



        <!-- ================================= -->
        <!--               МУЗЫКА                -->
        <!-- ================================= -->

        <section class="music" id="music">

            <h2>
                музяка
            </h2>

            <p>
                Это наши плейлисты)
            </p>


            <div class="music-card">

                <div class="music-title">
                    Сейчас играет
                </div>


                <div
                    class="music-name"
                    id="musicName"
                >
                    Название первой песни
                </div>


                <div class="music-controls">

                    <button
                        class="music-button"
                        id="musicButton"
                    >
                        ▶
                    </button>


                    <button
                        class="add-music-button"
                        id="addMusicButton"
                    >
                        Добавить музыку
                    </button>

                </div>


                <div class="track-list">

                    <div
                        class="track active"
                        data-track="music/song1.mp3"
                        data-name="Название первой песни"
                    >
                        Название первой песни
                    </div>


                    <div
                        class="track"
                        data-track="music/song2.mp3"
                        data-name="Название второй песни"
                    >
                        Название второй песни
                    </div>


                    <div
                        class="track"
                        data-track="music/song3.mp3"
                        data-name="Название третьей песни"
                    >
                        Название третьей песни
                    </div>

                </div>

            </div>

        </section>

    </main>



    <!-- ================================= -->
    <!--          КОНТЕЙНЕР СЕРДЕЦ           -->
    <!-- ================================= -->

    <div id="hearts-container"></div>



    <!-- ================================= -->
    <!--               AUDIO                 -->
    <!-- ================================= -->

    <audio id="audioPlayer"></audio>



    <script>

        /* ================================= */
        /*              СЕРДЦА                */
        /* ================================= */

        const button =
            document.getElementById("heartButton");

        const container =
            document.getElementById("hearts-container");


        button.addEventListener(
            "click",
            function () {

                for (
                    let i = 0;
                    i < 70;
                    i++
                ) {

                    createHeart();

                }

            }
        );


        function createHeart() {

            const heart =
                document.createElement("div");


            heart.className =
                "heart";


            heart.innerHTML =
                "♥";


            const startX =
                window.innerWidth / 2;


            const startY =
                window.innerHeight / 2;


            const angle =
                Math.random() *
                Math.PI *
                2;


            const distance =
                300 +
                Math.random() *
                1000;


            const endX =
                startX +
                Math.cos(angle) *
                distance;


            const endY =
                startY +
                Math.sin(angle) *
                distance;


            const scale =
                0.6 +
                Math.random() *
                1.4;


            const rotation =
                -360 +
                Math.random() *
                720;


            const duration =
                1.2 +
                Math.random() *
                1.8;


            heart.style.setProperty(
                "--start-x",
                startX + "px"
            );


            heart.style.setProperty(
                "--start-y",
                startY + "px"
            );


            heart.style.setProperty(
                "--end-x",
                endX + "px"
            );


            heart.style.setProperty(
                "--end-y",
                endY + "px"
            );


            heart.style.setProperty(
                "--scale",
                scale
            );


            heart.style.setProperty(
                "--rotation",
                rotation + "deg"
            );


            heart.style.animationDuration =
                duration + "s";


            heart.style.fontSize =
                (
                    14 +
                    Math.random() * 24
                ) + "px";


            container.appendChild(
                heart
            );


            setTimeout(
                function () {

                    heart.remove();

                },
                duration * 1000 + 100
            );

        }



        /* ================================= */
        /*              МУЗЫКА                */
        /* ================================= */

        const audioPlayer =
            document.getElementById("audioPlayer");


        const musicButton =
            document.getElementById("musicButton");


        const musicName =
            document.getElementById("musicName");


        const addMusicButton =
            document.getElementById("addMusicButton");


        const tracks =
            document.querySelectorAll(".track");


        let currentTrack =
            "music/song1.mp3";


        let isPlaying =
            false;



        /* ================================= */
        /*        ЗАГРУЗКА ПЕРВОГО ТРЕКА      */
        /* ================================= */

        audioPlayer.src =
            currentTrack;



        /* ================================= */
        /*          ВЫБОР ТРЕКА               */
        /* ================================= */

        tracks.forEach(
            function (track) {

                track.addEventListener(
                    "click",
                    function () {

                        tracks.forEach(
                            function (item) {

                                item.classList.remove(
                                    "active"
                                );

                            }
                        );


                        track.classList.add(
                            "active"
                        );


                        currentTrack =
                            track.dataset.track;


                        musicName.textContent =
                            track.dataset.name;


                        audioPlayer.src =
                            currentTrack;


                        isPlaying =
                            false;


                        musicButton.textContent =
                            "▶";


                        audioPlayer.load();

                    }
                );

            }
        );



        /* ================================= */
        /*          КНОПКА PLAY                */
        /* ================================= */

        musicButton.addEventListener(
            "click",
            function () {

                if (
                    audioPlayer.paused
                ) {

                    audioPlayer.play()
                        .then(
                            function () {

                                isPlaying =
                                    true;

                                musicButton.textContent =
                                    "❚❚";

                            }
                        )
                        .catch(
                            function (error) {

                                console.log(
                                    "Ошибка воспроизведения:",
                                    error
                                );

                            }
                        );

                } else {

                    audioPlayer.pause();

                    isPlaying =
                        false;

                    musicButton.textContent =
                        "▶";

                }

            }
        );



        /* ================================= */
        /*       КОГДА ТРЕК ЗАКОНЧИЛСЯ        */
        /* ================================= */

        audioPlayer.addEventListener(
            "ended",
            function () {

                const currentIndex =
                    Array.from(tracks).findIndex(
                        function (track) {

                            return track.classList.contains(
                                "active"
                            );

                        }
                    );


                const nextIndex =
                    (
                        currentIndex + 1
                    ) % tracks.length;


                tracks[
                    nextIndex
                ].click();


                audioPlayer.play()
                    .then(
                        function () {

                            isPlaying =
                                true;

                            musicButton.textContent =
                                "❚❚";

                        }
                    )
                    .catch(
                        function () {

                            musicButton.textContent =
                                "▶";

                        }
                    );

            }
        );



        /* ================================= */
        /*       КНОПКА ДОБАВИТЬ МУЗЫКУ       */
        /* ================================= */

        addMusicButton.addEventListener(
            "click",
            function () {

                window.open(
                    "https://github.com/dmetro2484285-debug/my-site/tree/main/music",
                    "_blank"
                );

            }
        );

    </script>

</body>
</html>
