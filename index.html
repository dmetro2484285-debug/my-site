<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>suspectstyle for nikto242</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

/* =========================
   КОСМОС
========================= */

.space {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(circle at center, #080808 0%, #010101 55%, #000 100%);
    z-index: -10;
}

.space::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,.55) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,.35) .7px, transparent 1px);
    background-size: 110px 110px, 170px 170px, 70px 70px;
    background-position: 10px 20px, 40px 80px, 20px 40px;
    opacity: .55;
}

/* =========================
   ЧЁРНАЯ ДЫРА
========================= */

.black-hole {
    position: absolute;
    width: 720px;
    height: 430px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    perspective: 900px;
}

/* основное свечение диска */
.accretion-disk {
    position: absolute;
    width: 720px;
    height: 150px;
    left: 50%;
    top: 50%;
    transform:
        translate(-50%, -50%)
        rotateX(68deg);
    border-radius: 50%;
    background:
        conic-gradient(
            from 0deg,
            #3a0000,
            #7d0900,
            #ff2400,
            #ff6a00,
            #ffd08a,
            #fff1cf,
            #ff8a00,
            #ff3200,
            #8e0900,
            #300000,
            #ff1e00,
            #ff8c00,
            #ffd18b,
            #ff4d00,
            #7b0500,
            #260000,
            #ff2800,
            #ff7800,
            #ffcf85,
            #ff2c00,
            #6d0300,
            #240000,
            #ff1c00,
            #ff6700,
            #ffb84c,
            #720400,
            #220000
        );
    filter: blur(5px);
    box-shadow:
        0 0 15px #ff1800,
        0 0 35px #ff3300,
        0 0 70px rgba(255,45,0,.8),
        0 0 120px rgba(255,20,0,.35);
    animation: diskRotate 4s linear infinite;
}

/* внутреннее кольцо */
.accretion-disk::before {
    content: "";
    position: absolute;
    inset: 18px 35px;
    border-radius: 50%;
    background:
        conic-gradient(
            from 180deg,
            #ff2100,
            #ffb000,
            #fff3d0,
            #ff6a00,
            #ff1900,
            #8c0500,
            #ff3d00,
            #ffd080,
            #ff2600,
            #710000,
            #ff2100
        );
    filter: blur(3px);
}

/* ещё одно тонкое кольцо */
.accretion-disk::after {
    content: "";
    position: absolute;
    width: 94%;
    height: 42%;
    left: 3%;
    top: 29%;
    border-radius: 50%;
    border: 2px solid rgba(255,210,130,.8);
    box-shadow:
        0 0 8px #ff6700,
        0 0 18px #ff2b00,
        inset 0 0 12px #ff4300;
}

/* чёрный центр */
.event-horizon {
    position: absolute;
    width: 225px;
    height: 225px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #000;
    z-index: 5;
    box-shadow:
        0 0 10px #000,
        0 0 30px #000,
        0 0 55px #000,
        0 0 90px rgba(0,0,0,.95);
}

/* тонкий край чёрной дыры */
.event-horizon::after {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 1px solid rgba(255,110,30,.35);
    box-shadow:
        0 0 12px rgba(255,50,0,.3);
}

/* верхняя часть искривлённого диска */
.lensed-top {
    position: absolute;
    width: 410px;
    height: 260px;
    left: 50%;
    top: 42px;
    transform: translateX(-50%);
    border-radius: 50% 50% 0 0;
    background:
        conic-gradient(
            from 180deg,
            #5c0200,
            #ff2600,
            #ff7800,
            #ffd18a,
            #fff0d0,
            #ff8a00,
            #ff2700,
            #600000
        );
    filter: blur(5px);
    clip-path: polygon(
        0 100%,
        5% 75%,
        15% 57%,
        25% 38%,
        38% 20%,
        50% 10%,
        62% 20%,
        75% 38%,
        85% 57%,
        95% 75%,
        100% 100%
    );
    z-index: 3;
    animation: topRotate 4s linear infinite;
    box-shadow:
        0 0 25px #ff3700,
        0 0 55px rgba(255,40,0,.8);
}

/* нижняя часть диска */
.lensed-bottom {
    position: absolute;
    width: 300px;
    height: 155px;
    left: 50%;
    bottom: 40px;
    transform: translateX(-50%);
    border-radius: 0 0 50% 50%;
    background:
        conic-gradient(
            from 0deg,
            #ff1900,
            #ff7600,
            #ffcf75,
            #ff4300,
            #7b0400,
            #ff2800,
            #ff9a20,
            #ff2600
        );
    filter: blur(5px);
    clip-path: ellipse(48% 45% at 50% 0%);
    z-index: 2;
    animation: bottomRotate 4s linear infinite reverse;
    box-shadow:
        0 0 25px #ff3000,
        0 0 55px rgba(255,40,0,.7);
}

/* тонкая горизонтальная линия диска */
.disk-line {
    position: absolute;
    width: 720px;
    height: 18px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background:
        linear-gradient(
            90deg,
            transparent 0%,
            #8b0900 8%,
            #ff2700 22%,
            #ffb43c 40%,
            #fff0ca 50%,
            #ffb43c 60%,
            #ff2700 78%,
            #8b0900 92%,
            transparent 100%
        );
    filter: blur(4px);
    z-index: 7;
    animation: linePulse 2s ease-in-out infinite alternate;
}

/* =========================
   АНИМАЦИЯ ЧЁРНОЙ ДЫРЫ
========================= */

@keyframes diskRotate {
    from {
        transform:
            translate(-50%, -50%)
            rotateX(68deg)
            rotateZ(0deg);
    }

    to {
        transform:
            translate(-50%, -50%)
            rotateX(68deg)
            rotateZ(360deg);
    }
}

@keyframes topRotate {
    from {
        transform: translateX(-50%) rotateZ(0deg);
    }

    to {
        transform: translateX(-50%) rotateZ(360deg);
    }
}

@keyframes bottomRotate {
    from {
        transform: translateX(-50%) rotateZ(0deg);
    }

    to {
        transform: translateX(-50%) rotateZ(360deg);
    }
}

@keyframes linePulse {
    from {
        opacity: .7;
        transform: translate(-50%, -50%) scaleX(.98);
    }

    to {
        opacity: 1;
        transform: translate(-50%, -50%) scaleX(1.02);
    }
}

/* =========================
   МЕНЮ
========================= */

nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 45px;
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,.08);
    z-index: 100;
}

.logo {
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
}

nav ul {
    display: flex;
    gap: 30px;
    list-style: none;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 14px;
    transition: .3s;
}

nav a:hover {
    color: #ff4a20;
}

/* =========================
   ГЛАВНАЯ
========================= */

.hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 100px 8%;
    position: relative;
    z-index: 10;
}

.hero-content {
    display: flex;
    align-items: center;
    gap: 70px;
    max-width: 1100px;
}

.characters {
    width: 440px;
    max-width: 45vw;
    transform: scaleY(1.5) translateY(-1px);
    pointer-events: none;
    mask-image: linear-gradient(
        to bottom,
        black 75%,
        transparent 100%
    );
    -webkit-mask-image: linear-gradient(
        to bottom,
        black 75%,
        transparent 100%
    );
}

.text {
    max-width: 500px;
}

.text h1 {
    font-size: clamp(45px, 7vw, 85px);
    line-height: .95;
    margin-bottom: 20px;
}

.text p {
    font-size: 20px;
    color: #aaa;
    margin-bottom: 30px;
}

.button {
    display: inline-block;
    padding: 15px 30px;
    border: 1px solid #ff3b1f;
    border-radius: 6px;
    background: rgba(255,50,20,.08);
    color: white;
    cursor: pointer;
    font-size: 16px;
    transition: .3s;
}

.button:hover {
    background: #ff3b1f;
    box-shadow: 0 0 25px rgba(255,50,20,.6);
}

/* =========================
   СЕКЦИИ
========================= */

section {
    min-height: 100vh;
    padding: 120px 8%;
    position: relative;
    z-index: 10;
}

section h2 {
    font-size: 50px;
    margin-bottom: 30px;
}

section p {
    color: #aaa;
    font-size: 18px;
}

/* =========================
   СЕРДЦА
========================= */

.heart {
    position: fixed;
    pointer-events: none;
    color: #ff2b2b;
    font-size: 20px;
    z-index: 999;
    animation: heartFly var(--duration) ease-out forwards;
}

@keyframes heartFly {
    0% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(.5)
            rotate(0deg);
    }

    100% {
        opacity: 0;
        transform:
            translate(
                calc(var(--x) - 50%),
                calc(var(--y) - 50%)
            )
            scale(var(--scale))
            rotate(var(--rotation));
    }
}

/* =========================
   ТЕЛЕФОН
========================= */

@media (max-width: 800px) {

    nav {
        padding: 0 20px;
    }

    nav ul {
        gap: 12px;
    }

    nav a {
        font-size: 12px;
    }

    .hero-content {
        flex-direction: column;
        gap: 20px;
        text-align: center;
    }

    .characters {
        width: 330px;
        max-width: 80vw;
    }

    .black-hole {
        width: 500px;
        height: 320px;
        transform: translate(-50%, -50%) scale(.65);
    }

    .text h1 {
        font-size: 48px;
    }

    .text p {
        font-size: 16px;
    }

    section h2 {
        font-size: 38px;
    }
}
</style>
</head>

<body>

<div class="space">

    <div class="black-hole">

        <div class="accretion-disk"></div>

        <div class="lensed-top"></div>

        <div class="lensed-bottom"></div>

        <div class="event-horizon"></div>

        <div class="disk-line"></div>

    </div>

</div>

<nav>
    <div class="logo">suspectstyle for nikto242</div>

    <ul>
        <li><a href="#home">Главная</a></li>
        <li><a href="#photos">Наши фото</a></li>
        <li><a href="#contacts">Контакты</a></li>
    </ul>
</nav>

<main>

<section class="hero" id="home">

    <div class="hero-content">

        <img
            src="characters.png"
            class="characters"
            alt="characters"
        >

        <div class="text">

            <h1>кайфовать.вместе</h1>

            <p>Это моя первая страница.</p>

            <button
                class="button"
                onclick="createHearts()"
            >
                Нажми меня
            </button>

        </div>

    </div>

</section>

<section id="photos">

    <h2>Наши фото</h2>

    <p>
        Здесь позже можно сделать отдельную галерею.
    </p>

</section>

<section id="contacts">

    <h2>Контакты</h2>

    <p>
        Здесь можно разместить контакты.
    </p>

</section>

</main>

<script>

function createHearts() {

    const button = document.querySelector(".button");
    const rect = button.getBoundingClientRect();

    const startX = rect.left + rect.width / 2;
    const startY = rect.top + rect.height / 2;

    for (let i = 0; i < 80; i++) {

        const heart = document.createElement("div");

        heart.className = "heart";
        heart.textContent = "♥";

        const x = Math.random() * window.innerWidth;
        const y = Math.random() * window.innerHeight;

        const scale = 0.5 + Math.random() * 2;
        const duration = 1.5 + Math.random() * 2;
        const rotation = -180 + Math.random() * 360;

        heart.style.left = startX + "px";
        heart.style.top = startY + "px";

        heart.style.setProperty(
            "--x",
            x + "px"
        );

        heart.style.setProperty(
            "--y",
            y + "px"
        );

        heart.style.setProperty(
            "--scale",
            scale
        );

        heart.style.setProperty(
            "--duration",
            duration + "s"
        );

        heart.style.setProperty(
            "--rotation",
            rotation + "deg"
        );

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, duration * 1000);
    }
}

</script>

</body>
</html>
