<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>suspectstyle for nikto242</title>


    <style>

        /* =========================================
           ОСНОВНЫЕ НАСТРОЙКИ
        ========================================= */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;

            min-height: 300vh;

            background: #000;

            color: white;

            font-family: Arial, sans-serif;

            overflow-x: hidden;
        }


        /* =========================================
           ФОН
        ========================================= */

        .space {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;

            height: 300vh;

            overflow: hidden;

            z-index: -10;

            background:
                radial-gradient(
                    circle at 35% 45%,
                    #191919 0%,
                    #0b0b0b 48%,
                    #020202 100%
                );
        }


        /* =========================================
           ЗВЁЗДЫ
        ========================================= */

        .space::before {
            content: "";

            position: absolute;

            inset: 0;

            background-image:

                radial-gradient(
                    circle,
                    rgba(255,255,255,0.9) 1px,
                    transparent 1.5px
                ),

                radial-gradient(
                    circle,
                    rgba(255,255,255,0.55) 1px,
                    transparent 1.5px
                ),

                radial-gradient(
                    circle,
                    rgba(255,255,255,0.35) 0.7px,
                    transparent 1px
                );

            background-size:
                110px 110px,
                170px 170px,
                70px 70px;

            background-position:
                10px 20px,
                40px 80px,
                20px 40px;

            opacity: 0.55;

            pointer-events: none;
        }


        /* =========================================
           СВЕЧЕНИЕ НА ФОНЕ
        ========================================= */

        .space::after {
            content: "";

            position: absolute;

            width: 700px;
            height: 700px;

            left: 50%;
            top: 40%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(35,35,35,0.7) 0%,
                    rgba(15,15,15,0.45) 35%,
                    rgba(5,5,5,0.2) 60%,
                    transparent 72%
                );

            filter: blur(12px);

            pointer-events: none;
        }


        /* =========================================
           ВЕРХНЕЕ МЕНЮ
        ========================================= */

        nav {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;

            height: 60px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 42px;

            background:
                rgba(3, 3, 3, 0.65);

            backdrop-filter: blur(10px);

            border-bottom:
                1px solid #202020;

            z-index: 1000;
        }


        /* ЛОГО */

        .logo {
            font-size: 18px;

            font-weight: bold;

            letter-spacing: 1px;

            white-space: nowrap;
        }


        /* МЕНЮ */

        .menu {
            display: flex;

            gap: 30px;
        }


        .menu a {
            color: #777;

            text-decoration: none;

            font-size: 15px;

            transition: 0.25s;
        }


        .menu a:hover {
            color: white;
        }


        /* =========================================
           ГЛАВНАЯ ЧАСТЬ
        ========================================= */

        .hero {
            width: 100%;

            min-height: 100vh;

            display: flex;

            align-items: center;

            padding-top: 60px;

            position: relative;

            z-index: 10;
        }


        .hero-content {
            width: 100%;

            min-height:
                calc(100vh - 60px);

            display: flex;

            align-items: flex-end;

            justify-content: center;

            position: relative;
        }


        /* =========================================
           ПЕРСОНАЖИ
           
           ТВОИ СТАРЫЕ РАЗМЕРЫ
        ========================================= */

        .characters {
            width: 58%;

            height:
                calc(100vh - 60px);

            display: flex;

            align-items: flex-end;

            justify-content: center;

            position: relative;

            flex-shrink: 0;
        }


        .characters img {
            width: 1250px;

            max-width: 140%;

            height: auto;

            display: block;

            /*
                Картинка не блокирует кнопку
            */

            pointer-events: none;


            /*
                Твой старый размер
            */

            transform:
                scaleY(1.5)
                translateY(-1px);

            transform-origin:
                bottom center;


            filter:
                drop-shadow(
                    0 0 30px
                    rgba(255, 255, 255, 0.07)
                );


            /*
                Плавное исчезновение
                нижней части картинки
            */

            -webkit-mask-image:
                linear-gradient(
                    to bottom,
                    black 88%,
                    rgba(0, 0, 0, 0.95) 94%,
                    rgba(0, 0, 0, 0.8) 98%,
                    transparent 100%
                );

            mask-image:
                linear-gradient(
                    to bottom,
                    black 88%,
                    rgba(0, 0, 0, 0.95) 94%,
                    rgba(0, 0, 0, 0.8) 98%,
                    transparent 100%
                );
        }


        /* =========================================
           ТЕКСТ
        ========================================= */

        .text {
            width: 42%;

            padding-left: 5px;

            padding-right: 25px;

            margin-bottom: 25vh;

            position: relative;

            z-index: 50;
        }


        .text h1 {
            margin: 0;

            /*
                Было 54px.
                Сделали 46px, чтобы
                "кайфовать.вместе"
                полностью помещалось.
            */

            font-size: 46px;

            font-weight: 700;

            white-space: nowrap;

            letter-spacing: -1px;

            text-shadow:
                0 0 10px
                rgba(255, 255, 255, 0.25),

                0 0 30px
                rgba(255, 255, 255, 0.12);
        }


        .text p {
            margin-top: 25px;

            color: #888;

            font-size: 18px;

            margin-bottom: 0;
        }


        /* =========================================
           КНОПКА
        ========================================= */

        button {
            margin-top: 25px;

            padding: 13px 30px;

            background:
                rgba(15, 15, 15, 0.8);

            color: white;

            border:
                1px solid #ff2b2b;

            border-radius: 8px;

            font-size: 16px;

            cursor: pointer;

            transition: 0.25s;

            position: relative;

            z-index: 100;
        }


        button:hover {
            background: #222;

            border-color: #ff2b2b;

            transform: scale(1.05);

            box-shadow:
                0 0 25px
                rgba(255, 43, 43, 0.25);
        }


        /* =========================================
           СЕРДЕЧКИ
        ========================================= */

        .heart {
            position: fixed;

            pointer-events: none;

            color: #ff2b2b;

            z-index: 99999;

            user-select: none;

            text-shadow:
                0 0 8px
                rgba(255, 43, 43, 0.5);
        }


        /* =========================================
           СЕКЦИИ
        ========================================= */

        section:not(.hero) {
            min-height: 100vh;

            padding:
                120px 8%;

            position: relative;

            z-index: 10;
        }


        section:not(.hero) h2 {
            margin: 0 0 30px 0;

            font-size: 50px;
        }


        section:not(.hero) p {
            color: #888;

            font-size: 18px;
        }


        /* =========================================
           МОБИЛЬНАЯ ВЕРСИЯ
        ========================================= */

        @media (max-width: 1000px) {

            nav {
                padding:
                    0 25px;
            }


            .menu {
                gap: 18px;
            }


            .menu a {
                font-size: 13px;
            }


            .hero-content {
                flex-direction: column;

                align-items: center;

                justify-content: center;
            }


            .characters {
                width: 100%;

                height: 65vh;
            }


            .characters img {
                width: 1250px;

                max-width: 140%;
            }


            .text {
                width: 100%;

                padding:
                    20px;

                margin-bottom: 0;

                text-align: center;
            }


            .text h1 {
                font-size: 44px;

                white-space: normal;
            }
        }


        /* =========================================
           МАЛЕНЬКИЙ ЭКРАН
        ========================================= */

        @media (max-width: 600px) {

            nav {
                height: 55px;

                padding:
                    0 15px;
            }


            .logo {
                font-size: 13px;
            }


            .menu {
                gap: 10px;
            }


            .menu a {
                font-size: 10px;
            }


            .hero {
                padding-top: 55px;
            }


            .characters {
                height: 55vh;
            }


            .characters img {
                width: 1000px;

                max-width: 150%;
            }


            .text h1 {
                font-size: 38px;
            }


            .text p {
                font-size: 16px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================
         ФОН
    ========================================= -->

    <div class="space"></div>


    <!-- =========================================
         ВЕРХНЕЕ МЕНЮ
    ========================================= -->

    <nav>

        <div class="logo">
            suspectstyle for nikto242
        </div>


        <div class="menu">

            <a href="#home">
                Главная
            </a>

            <a href="#photos">
                Наши фото
            </a>

            <a href="#contacts">
                Контакты
            </a>

        </div>

    </nav>


    <!-- =========================================
         ГЛАВНАЯ
    ========================================= -->

    <main>

        <section
            class="hero"
            id="home"
        >

            <div class="hero-content">


                <!-- ПЕРСОНАЖИ -->

                <div class="characters">

                    <img
                        src="characters.png"
                        alt="Персонажи"
                    >

                </div>


                <!-- ТЕКСТ -->

                <div class="text">

                    <h1>
                        кайфовать.вместе
                    </h1>


                    <p>
                        Это моя первая страница.
                    </p>


                    <button
                        onclick="hello()"
                    >
                        Нажми меня
                    </button>

                </div>

            </div>

        </section>


        <!-- =====================================
             НАШИ ФОТО
        ===================================== -->

        <section id="photos">

            <h2>
                Наши фото
            </h2>

            <p>
                Здесь позже можно сделать отдельную галерею.
            </p>

        </section>


        <!-- =====================================
             КОНТАКТЫ
        ===================================== -->

        <section id="contacts">

            <h2>
                Контакты
            </h2>

            <p>
                Здесь можно разместить контакты.
            </p>

        </section>

    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>

        function hello() {

            /*
                Количество сердечек
            */

            const amount = 80;


            /*
                Находим кнопку
            */

            const button =
                document.querySelector("button");


            /*
                Получаем её положение
                на экране
            */

            const rect =
                button.getBoundingClientRect();


            /*
                Точка, откуда вылетают
                сердечки
            */

            const startX =
                rect.left +
                rect.width / 2;


            const startY =
                rect.top +
                rect.height / 2;


            /*
                Создаём сердечки
            */

            for (
                let i = 0;
                i < amount;
                i++
            ) {


                const heart =
                    document.createElement("div");


                heart.className =
                    "heart";


                heart.textContent =
                    "♥";


                /*
                    Размер сердечка
                */

                const size =
                    12 +
                    Math.random() * 22;


                heart.style.fontSize =
                    size + "px";


                /*
                    Начальная позиция
                */

                heart.style.left =
                    startX + "px";


                heart.style.top =
                    startY + "px";


                /*
                    Случайный угол
                    от 0 до 360 градусов
                */

                const angle =
                    Math.random() *
                    Math.PI *
                    2;


                /*
                    Расстояние,
                    на которое полетит сердце
                */

                const distance =
                    300 +
                    Math.random() * 900;


                /*
                    Рассчитываем X и Y
                */

                const x =
                    Math.cos(angle) *
                    distance;


                const y =
                    Math.sin(angle) *
                    distance;


                /*
                    Немного случайного
                    вращения
                */

                const rotation =
                    -180 +
                    Math.random() * 360;


                /*
                    Конечный размер
                */

                const scale =
                    0.6 +
                    Math.random() * 1.5;


                /*
                    Продолжительность
                */

                const duration =
                    1400 +
                    Math.random() * 1800;


                /*
                    Анимация
                */

                const animation =
                    heart.animate(

                        [

                            {
                                transform:
                                    "translate(-50%, -50%) " +
                                    "scale(0.2) " +
                                    "rotate(0deg)",

                                opacity: 0
                            },


                            {
                                transform:
                                    "translate(-50%, -50%) " +
                                    "scale(1) " +
                                    "rotate(20deg)",

                                opacity: 1
                            },


                            {
                                transform:
                                    "translate(" +
                                    "calc(-50% + " +
                                    x +
                                    "px), " +
                                    "calc(-50% + " +
                                    y +
                                    "px)) " +
                                    "scale(" +
                                    scale +
                                    ") " +
                                    "rotate(" +
                                    rotation +
                                    "deg)",

                                opacity: 0
                            }

                        ],

                        {

                            duration:
                                duration,

                            easing:
                                "cubic-bezier(.15,.8,.25,1)",

                            fill:
                                "forwards"

                        }

                    );


                /*
                    Удаляем сердце
                    после анимации
                */

                animation.finished
                    .then(() => {

                        heart.remove();

                    })
                    .catch(() => {

                        heart.remove();

                    });

            }

        }

    </script>


</body>

</html>
