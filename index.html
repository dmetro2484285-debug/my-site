<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>suspectstyle for nikto242</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

/* =========================
   КОСМОС
========================= */

.space {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(
            circle at center,
            #090909 0%,
            #020202 55%,
            #000 100%
        );
    z-index: -10;
}

.space::before {
    content: "";
    position: absolute;
    inset: 0;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.9) 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(255,255,255,.55) 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(255,255,255,.35) .7px,
            transparent 1px
        );

    background-size:
        110px 110px,
        170px 170px,
        70px 70px;

    background-position:
        10px 20px,
        40px 80px,
        20px 40px;

    opacity: .55;
}

/* =========================
   ЧЁРНАЯ ДЫРА
========================= */

.black-hole {
    position: absolute;

    width: 760px;
    height: 500px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    pointer-events: none;
}

/* Весь вращающийся диск */

.hole-rotation {
    position: absolute;

    width: 100%;
    height: 100%;

    left: 0;
    top: 0;

    animation: holeSpin 7s linear infinite;
}

/* Основной горизонтальный диск */

.disk {
    position: absolute;

    width: 760px;
    height: 125px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse at center,
            #fff4d5 0%,
            #ffd27a 7%,
            #ff8c00 17%,
            #ff3b00 30%,
            #c81700 48%,
            #650500 68%,
            #220000 82%,
            transparent 100%
        );

    filter: blur(4px);

    box-shadow:
        0 0 15px rgba(255,70,0,.9),
        0 0 35px rgba(255,40,0,.7),
        0 0 70px rgba(255,20,0,.35);
}

/* Яркая тонкая линия */

.disk-line {
    position: absolute;

    width: 760px;
    height: 15px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        linear-gradient(
            90deg,
            transparent 0%,
            #8b0800 8%,
            #ff2a00 22%,
            #ff9b22 38%,
            #fff1c7 50%,
            #ff9b22 62%,
            #ff2a00 78%,
            #8b0800 92%,
            transparent 100%
        );

    filter: blur(3px);

    opacity: .95;
}

/* =========================
   ИСКРИВЛЁННЫЙ ДИСК СВЕРХУ
========================= */

.top-lens {
    position: absolute;

    width: 440px;
    height: 300px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            transparent 0%,
            transparent 29%,
            rgba(255,230,180,.95) 30%,
            rgba(255,155,40,.95) 34%,
            #ff4a00 39%,
            #c41400 46%,
            transparent 58%
        );

    filter: blur(4px);

    clip-path: inset(0 0 50% 0);

    opacity: .95;
}

/* Второе тонкое кольцо сверху */

.top-lens::after {
    content: "";

    position: absolute;

    width: 390px;
    height: 255px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    border: 8px solid rgba(255,120,20,.7);

    box-shadow:
        0 0 15px #ff4500,
        0 0 30px rgba(255,50,0,.7);

    clip-path: inset(0 0 50% 0);
}

/* =========================
   ИСКРИВЛЁННЫЙ ДИСК СНИЗУ
========================= */

.bottom-lens {
    position: absolute;

    width: 360px;
    height: 245px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            transparent 0%,
            transparent 28%,
            rgba(255,205,120,.9) 30%,
            #ff7b00 36%,
            #ff3100 43%,
            #8d0800 52%,
            transparent 65%
        );

    filter: blur(4px);

    clip-path: inset(50% 0 0 0);

    opacity: .85;
}

/* =========================
   ГОРИЗОНТ СОБЫТИЙ
========================= */

.event-horizon {
    position: absolute;

    width: 210px;
    height: 210px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: #000;

    z-index: 10;

    box-shadow:
        0 0 10px #000,
        0 0 25px #000,
        0 0 50px #000,
        0 0 80px rgba(0,0,0,.95);
}

/* Тонкая светящаяся граница */

.event-horizon::before {
    content: "";

    position: absolute;

    inset: -2px;

    border-radius: 50%;

    border: 1px solid rgba(255,110,30,.45);

    box-shadow:
        0 0 8px rgba(255,60,0,.35);
}

/* Чёрная сердцевина */

.event-horizon::after {
    content: "";

    position: absolute;

    inset: 12px;

    border-radius: 50%;

    background: #000;
}

/* =========================
   ВРАЩЕНИЕ
========================= */

@keyframes holeSpin {

    0% {
        transform: rotate(0deg);
    }

    100% {
        transform: rotate(360deg);
    }

}

/* =========================
   МЕНЮ
========================= */

nav {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 70px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 0 45px;

    background: rgba(0,0,0,.55);

    backdrop-filter: blur(12px);

    border-bottom:
        1px solid rgba(255,255,255,.08);

    z-index: 100;
}

.logo {
    font-size: 18px;

    font-weight: bold;

    letter-spacing: 1px;
}

nav ul {
    display: flex;

    gap: 30px;

    list-style: none;
}

nav a {
    color: white;

    text-decoration: none;

    font-size: 14px;

    transition: .3s;
}

nav a:hover {
    color: #ff4a20;
}

/* =========================
   ГЛАВНАЯ
========================= */

.hero {
    min-height: 100vh;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 100px 8%;

    position: relative;

    z-index: 10;
}

.hero-content {
    display: flex;

    align-items: center;

    gap: 70px;

    max-width: 1100px;

    position: relative;

    z-index: 20;
}

.characters {
    width: 440px;

    max-width: 45vw;

    transform:
        scaleY(1.5)
        translateY(-1px);

    pointer-events: none;

    mask-image:
        linear-gradient(
            to bottom,
            black 75%,
            transparent 100%
        );

    -webkit-mask-image:
        linear-gradient(
            to bottom,
            black 75%,
            transparent 100%
        );
}

.text {
    max-width: 500px;

    position: relative;

    z-index: 30;
}

.text h1 {
    font-size:
        clamp(45px, 7vw, 85px);

    line-height: .95;

    margin-bottom: 20px;

    white-space: nowrap;
}

.text p {
    font-size: 20px;

    color: #aaa;

    margin-bottom: 30px;
}

.button {
    display: inline-block;

    padding: 15px 30px;

    border:
        1px solid #ff3b1f;

    border-radius: 6px;

    background:
        rgba(255,50,20,.08);

    color: white;

    cursor: pointer;

    font-size: 16px;

    transition: .3s;

    position: relative;

    z-index: 40;
}

.button:hover {
    background: #ff3b1f;

    box-shadow:
        0 0 25px rgba(255,50,20,.6);
}

/* =========================
   СЕКЦИИ
========================= */

section {
    min-height: 100vh;

    padding: 120px 8%;

    position: relative;

    z-index: 10;
}

section h2 {
    font-size: 50px;

    margin-bottom: 30px;
}

section p {
    color: #aaa;

    font-size: 18px;
}

/* =========================
   СЕРДЦА
========================= */

.heart {
    position: fixed;

    pointer-events: none;

    color: #ff2b2b;

    font-size: 20px;

    z-index: 999;

    animation:
        heartFly
        var(--duration)
        ease-out
        forwards;
}

@keyframes heartFly {

    0% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(.5)
            rotate(0deg);
    }

    100% {
        opacity: 0;

        transform:
            translate(
                calc(var(--x) - 50%),
                calc(var(--y) - 50%)
            )
            scale(var(--scale))
            rotate(var(--rotation));
    }

}

/* =========================
   ТЕЛЕФОН
========================= */

@media (max-width: 800px) {

    nav {
        padding: 0 20px;
    }

    nav ul {
        gap: 12px;
    }

    nav a {
        font-size: 12px;
    }

    .hero-content {
        flex-direction: column;

        gap: 20px;

        text-align: center;
    }

    .characters {
        width: 330px;

        max-width: 80vw;
    }

    .black-hole {
        width: 600px;

        height: 400px;

        transform:
            translate(-50%, -50%)
            scale(.65);
    }

    .text h1 {
        font-size: 48px;

        white-space: normal;
    }

    .text p {
        font-size: 16px;
    }

    section h2 {
        font-size: 38px;
    }
}

</style>
</head>

<body>

<!-- =========================
     ФОН
========================= -->

<div class="space">

    <div class="black-hole">

        <div class="hole-rotation">

            <div class="disk"></div>

            <div class="top-lens"></div>

            <div class="bottom-lens"></div>

            <div class="disk-line"></div>

        </div>

        <div class="event-horizon"></div>

    </div>

</div>


<!-- =========================
     МЕНЮ
========================= -->

<nav>

    <div class="logo">
        suspectstyle for nikto242
    </div>

    <ul>

        <li>
            <a href="#home">
                Главная
            </a>
        </li>

        <li>
            <a href="#photos">
                Наши фото
            </a>
        </li>

        <li>
            <a href="#contacts">
                Контакты
            </a>
        </li>

    </ul>

</nav>


<!-- =========================
     ГЛАВНАЯ
========================= -->

<main>

<section
    class="hero"
    id="home"
>

    <div class="hero-content">

        <img
            src="characters.png"
            class="characters"
            alt="characters"
        >

        <div class="text">

            <h1>
                кайфовать.вместе
            </h1>

            <p>
                Это моя первая страница.
            </p>

            <button
                class="button"
                onclick="createHearts()"
            >
                Нажми меня
            </button>

        </div>

    </div>

</section>


<!-- =========================
     ФОТО
========================= -->

<section id="photos">

    <h2>
        Наши фото
    </h2>

    <p>
        Здесь позже можно сделать отдельную галерею.
    </p>

</section>


<!-- =========================
     КОНТАКТЫ
========================= -->

<section id="contacts">

    <h2>
        Контакты
    </h2>

    <p>
        Здесь можно разместить контакты.
    </p>

</section>

</main>


<script>

/* =========================
   СЕРДЦА
========================= */

function createHearts() {

    const button =
        document.querySelector(".button");

    const rect =
        button.getBoundingClientRect();

    const startX =
        rect.left + rect.width / 2;

    const startY =
        rect.top + rect.height / 2;

    for (let i = 0; i < 80; i++) {

        const heart =
            document.createElement("div");

        heart.className = "heart";

        heart.textContent = "♥";

        const x =
            Math.random() *
            window.innerWidth;

        const y =
            Math.random() *
            window.innerHeight;

        const scale =
            0.5 + Math.random() * 2;

        const duration =
            1.5 + Math.random() * 2;

        const rotation =
            -180 +
            Math.random() * 360;

        heart.style.left =
            startX + "px";

        heart.style.top =
            startY + "px";

        heart.style.setProperty(
            "--x",
            x + "px"
        );

        heart.style.setProperty(
            "--y",
            y + "px"
        );

        heart.style.setProperty(
            "--scale",
            scale
        );

        heart.style.setProperty(
            "--duration",
            duration + "s"
        );

        heart.style.setProperty(
            "--rotation",
            rotation + "deg"
        );

        document.body.appendChild(heart);

        setTimeout(
            () => heart.remove(),
            duration * 1000
        );
    }
}

</script>

</body>
</html>
