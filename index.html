<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>кайфовать.вместе</title>

    <style>

        * {
            box-sizing: border-box;
        }


        /* =========================
           ОСНОВА
        ========================= */

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% 50%,
                    #191919 0%,
                    #0b0b0b 48%,
                    #020202 100%
                );

            color: white;
            font-family: Arial, sans-serif;

            overflow-x: hidden;
        }


        /* =========================
           ЗВЁЗДЫ
        ========================= */

        body::before {
            content: "";
            position: fixed;

            inset: 0;

            pointer-events: none;

            background-image:
                radial-gradient(circle, rgba(255,255,255,0.7) 1px, transparent 1px),
                radial-gradient(circle, rgba(255,255,255,0.4) 1px, transparent 1px);

            background-size:
                110px 110px,
                170px 170px;

            background-position:
                0 0,
                40px 70px;

            opacity: 0.65;

            z-index: 0;
        }


        /* =========================
           ВЕРХНЕЕ МЕНЮ
        ========================= */

        nav {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 60px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 42px;

            background: rgba(3, 3, 3, 0.72);

            border-bottom: 1px solid #202020;

            backdrop-filter: blur(8px);

            z-index: 100;
        }


        .logo {
            font-size: 18px;
            font-weight: bold;

            letter-spacing: 3px;

            white-space: nowrap;
        }


        .menu {
            display: flex;

            gap: 32px;
        }


        .menu a {
            color: #777;

            text-decoration: none;

            font-size: 15px;

            transition: 0.25s;
        }


        .menu a:hover {
            color: white;
        }


        /* =========================
           ГЛАВНЫЙ БЛОК
        ========================= */

        .hero {
            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;

            padding-top: 60px;

            position: relative;

            z-index: 1;
        }


        /* =========================
           ПЕРСОНАЖИ
        ========================= */

        .characters {
            width: 58%;
            height: calc(100vh - 60px);

            display: flex;
            align-items: flex-end;
            justify-content: center;

            position: relative;

            z-index: 2;
        }


        .characters img {
            width: 1250px;

            max-width: 140%;

            height: auto;

            display: block;

            /* Картинка не блокирует кнопку */
            pointer-events: none;

            transform:
                scaleY(1.5)
                translateY(-1px);

            transform-origin: bottom center;

            filter:
                drop-shadow(
                    0 0 30px rgba(255, 255, 255, 0.07)
                );

            -webkit-mask-image:
                linear-gradient(
                    to bottom,
                    black 88%,
                    rgba(0, 0, 0, 0.95) 94%,
                    rgba(0, 0, 0, 0.8) 98%,
                    transparent 100%
                );

            mask-image:
                linear-gradient(
                    to bottom,
                    black 88%,
                    rgba(0, 0, 0, 0.95) 94%,
                    rgba(0, 0, 0, 0.8) 98%,
                    transparent 100%
                );
        }


        /* =========================
           ТЕКСТ
        ========================= */

        .text {
            width: 42%;

            padding-left: 5px;

            margin-top: -30px;

            position: relative;

            z-index: 20;
        }


        .text h1 {
            margin: 0;

            /*
               Не даём заголовку уехать
               за правый край экрана
            */
            font-size: clamp(38px, 4vw, 54px);

            font-weight: 700;

            white-space: nowrap;

            max-width: 100%;

            text-shadow:
                0 0 10px rgba(255, 255, 255, 0.25),
                0 0 30px rgba(255, 255, 255, 0.12);
        }


        .text p {
            margin-top: 25px;

            color: #888;

            font-size: 18px;
        }


        /* =========================
           КНОПКА
        ========================= */

        button {
            position: relative;

            z-index: 10000;

            margin-top: 25px;

            padding: 13px 30px;

            background: rgba(15, 15, 15, 0.9);

            color: white;

            border: 1px solid #ff2b2b;

            border-radius: 8px;

            font-size: 16px;

            cursor: pointer;

            transition: 0.25s;

            pointer-events: auto;
        }


        button:hover {
            background: #222;

            border-color: #ff2b2b;

            transform: scale(1.05);

            box-shadow:
                0 0 25px rgba(255, 43, 43, 0.35);
        }


        /* =========================
           СЛОЙ СЕРДЕЧЕК
        ========================= */

        #hearts-container {
            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            pointer-events: none;

            overflow: hidden;

            z-index: 9999;
        }


        /* =========================
           ОТДЕЛЬНОЕ СЕРДЕЧКО
        ========================= */

        .heart {
            position: absolute;

            left: 0;
            top: 0;

            color: #ff2b2b;

            font-size: 24px;

            line-height: 1;

            pointer-events: none;

            user-select: none;

            will-change: transform, opacity;

            text-shadow:
                0 0 8px rgba(255, 43, 43, 0.5);

            animation-name: flyHeart;

            animation-timing-function: ease-out;

            animation-fill-mode: forwards;
        }


        /* =========================
           ПОЛЁТ СЕРДЕЧКА
        ========================= */

        @keyframes flyHeart {

            0% {
                transform:
                    translate(
                        var(--start-x),
                        var(--start-y)
                    )
                    scale(0.3)
                    rotate(0deg);

                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            100% {
                transform:
                    translate(
                        var(--end-x),
                        var(--end-y)
                    )
                    scale(var(--scale))
                    rotate(var(--rotation));

                opacity: 0;
            }
        }


        /* =========================
           ВТОРАЯ СЕКЦИЯ
        ========================= */

        .photos {
            min-height: 100vh;

            padding: 120px 8%;

            position: relative;

            z-index: 1;
        }


        .photos h2 {
            margin: 0 0 25px;

            font-size: 48px;
        }


        .photos p {
            color: #888;

            font-size: 18px;
        }


        /* =========================
           АДАПТАЦИЯ
        ========================= */

        @media (max-width: 1000px) {

            nav {
                padding: 0 25px;
            }

            .menu {
                gap: 20px;
            }

            .hero {
                flex-direction: column;

                align-items: center;
            }

            .characters {
                width: 100%;

                height: 60vh;
            }

            .characters img {
                width: 900px;

                max-width: 130%;
            }

            .text {
                width: 90%;

                padding: 30px 0;

                text-align: center;

                margin-top: 0;
            }

            .text h1 {
                white-space: normal;
            }
        }


        @media (max-width: 600px) {

            nav {
                padding: 0 15px;
            }

            .logo {
                font-size: 14px;

                letter-spacing: 2px;
            }

            .menu {
                gap: 12px;
            }

            .menu a {
                font-size: 12px;
            }

            .characters {
                height: 55vh;
            }

            .characters img {
                width: 700px;

                max-width: 140%;
            }

            .text h1 {
                font-size: 36px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         МЕНЮ
    ========================= -->

    <nav>

        <div class="logo">
            suspectstyle for nikto242
        </div>


        <div class="menu">

            <a href="#">
                Главная
            </a>

            <a href="#photos">
                Наши фото
            </a>

            <a href="#">
                Контакты
            </a>

        </div>

    </nav>



    <!-- =========================
         СЛОЙ СЕРДЕЧЕК
    ========================= -->

    <div id="hearts-container"></div>



    <!-- =========================
         ГЛАВНАЯ
    ========================= -->

    <main class="hero">


        <!-- ПЕРСОНАЖИ -->

        <div class="characters">

            <img
                src="characters.png"
                alt="Персонажи"
            >

        </div>



        <!-- ТЕКСТ -->

        <div class="text">

            <h1>
                кайфовать.вместе
            </h1>


            <p>
                Это моя первая страница.
            </p>


            <button id="heartButton">
                Нажми меня
            </button>

        </div>


    </main>



    <!-- =========================
         НАШИ ФОТО
    ========================= -->

    <section
        class="photos"
        id="photos"
    >

        <h2>
            Наши фото
        </h2>

        <p>
            Здесь позже можно сделать отдельную галерею.
        </p>

    </section>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        const button =
            document.getElementById("heartButton");

        const container =
            document.getElementById("hearts-container");


        button.addEventListener("click", function () {

            /*
                Создаём сразу много сердечек
            */

            for (let i = 0; i < 70; i++) {

                createHeart();

            }

        });



        function createHeart() {

            const heart =
                document.createElement("div");


            heart.className = "heart";


            heart.innerHTML = "♥";


            /*
                Начальная точка —
                центр экрана.

                Поэтому сердечки действительно
                могут лететь во все стороны.
            */

            const startX =
                window.innerWidth / 2;

            const startY =
                window.innerHeight / 2;


            /*
                Случайное направление.

                X:
                влево или вправо

                Y:
                вверх или вниз
            */

            const angle =
                Math.random() * Math.PI * 2;


            /*
                Расстояние полёта.
            */

            const distance =
                250 + Math.random() * 850;


            const endX =
                startX +
                Math.cos(angle) * distance;


            const endY =
                startY +
                Math.sin(angle) * distance;


            /*
                Случайный размер.
            */

            const scale =
                0.6 + Math.random() * 1.4;


            /*
                Случайное вращение.
            */

            const rotation =
                -360 + Math.random() * 720;


            /*
                Случайная длительность.
            */

            const duration =
                1.2 + Math.random() * 1.8;


            /*
                Передаём значения
                в CSS.
            */

            heart.style.setProperty(
                "--start-x",
                startX + "px"
            );


            heart.style.setProperty(
                "--start-y",
                startY + "px"
            );


            heart.style.setProperty(
                "--end-x",
                endX + "px"
            );


            heart.style.setProperty(
                "--end-y",
                endY + "px"
            );


            heart.style.setProperty(
                "--scale",
                scale
            );


            heart.style.setProperty(
                "--rotation",
                rotation + "deg"
            );


            heart.style.animationDuration =
                duration + "s";


            /*
                Небольшое случайное
                отклонение размера.
            */

            heart.style.fontSize =
                (14 + Math.random() * 24) + "px";


            /*
                Добавляем сердце
                на самый верхний слой.
            */

            container.appendChild(heart);


            /*
                Удаляем его после
                окончания анимации.
            */

            setTimeout(function () {

                heart.remove();

            }, duration * 1000 + 100);

        }

    </script>


</body>
</html>
